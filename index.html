<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ダーツターゲットコントローラー</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 12px;
      background-color: #f0f2f5;
      color: #333;
      margin: 0;
    }
    .card {
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 12px;
    }
    h2 { margin-top: 0; color: #1a73e8; font-size: 1.1rem; }
    .btn {
      background-color: #007aff;
      color: white;
      border: none;
      padding: 14px 16px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      margin-top: 5px;
    }
    .btn:active { background-color: #0056b3; }
    .btn-secondary { background-color: #8e8e93; }
    .btn-warning { background-color: #ff9500; }
    .radio-group { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
    .radio-label { display: flex; align-items: center; font-size: 15px; cursor: pointer; }
    .radio-label input { margin-right: 8px; transform: scale(1.2); }
    .desc-box {
      background-color: #eef3fc;
      border-left: 4px solid #007aff;
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.5;
      border-radius: 4px;
      margin-top: 10px;
    }
    input[type="text"], input[type="number"] {
      font-size: 16px;
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    .player-inputs { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .player-row { display: flex; align-items: center; gap: 10px; }

    /* ⏱️ 全画面カウントダウン */
    #countdownOverlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.95);
      color: #ff3b30;
      font-size: 80px;
      font-weight: 900;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 9999;
      letter-spacing: 2px;
      text-align: center;
    }
    #countPlayerTitle {
      font-size: 28px;
      color: #34c759;
      margin-bottom: 20px;
    }

    /* 🎯 プレイ画面 */
    #gameScreen {
      display: none;
    }
    .score-board {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    .player-card {
      background: #f8f9fa;
      border: 3px solid #ddd;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      transition: all 0.3s ease;
    }
    .player-card.active {
      border-color: #007aff;
      background: #eef6ff;
      box-shadow: 0 0 12px rgba(0, 122, 255, 0.4);
      transform: scale(1.02);
    }
    .p-name { font-size: 1.1rem; font-weight: bold; color: #333; margin-bottom: 5px; }
    .p-score { font-size: 2.2rem; font-weight: bold; color: #1a73e8; margin: 5px 0; }
    .p-sub { font-size: 0.85rem; color: #666; }

    .game-status-bar {
      background: #333;
      color: white;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
      margin-bottom: 10px;
    }

    /* 💥 命中ポップアップ */
    .hit-pop {
      background: #ffcc00;
      color: #000;
      font-size: 1.4rem;
      font-weight: bold;
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      margin: 10px 0;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* 🔄 交代待機カード */
    .change-turn-box {
      background: #fff3cd;
      border: 2px solid #ffeba2;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      margin: 10px 0;
    }

    /* 📊 履歴 */
    .history-list {
      list-style: none; padding: 0; margin: 0;
      max-height: 180px; overflow-y: auto;
      border: 1px solid #ddd; border-radius: 8px; background: #fafafa;
    }
    .history-item {
      padding: 8px 12px; border-bottom: 1px solid #eee; font-size: 13px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .history-item.round-end { background-color: #e3f2fd; font-weight: bold; color: #0d47a1; }
    .history-item.game-end { background-color: #e8f5e9; font-weight: bold; color: #1b5e20; }
    .badge { background: #007aff; color: white; padding: 2px 8px; border-radius: 12px; font-size: 11px; }

    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <!-- カウントダウン画面オーバレイ -->
  <div id="countdownOverlay">
    <div id="countPlayerTitle">Next Player</div>
    <div id="countNum">3</div>
  </div>

  <!-- ---------------- 1. 設定画面 ---------------- -->
  <div id="setupScreen">
    <h1>🎯 ダーツボード設定</h1>

    <div class="card">
      <h2>1. ESP32接続</h2>
      <button class="btn" onclick="connectBLE()">Bluetooth 接続開始</button>
      <p id="status" style="margin-top:8px; font-weight:bold; color:red;">未接続</p>
    </div>

    <div class="card">
      <h2>2. プレイヤー登録</h2>
      <div class="player-inputs">
        <div class="player-row">
          <label style="width: 80px; font-weight:bold;">P1名前:</label>
          <input type="text" id="p1Name" value="Player1" style="flex:1;">
        </div>
        <div class="player-row">
          <label style="width: 80px; font-weight:bold;">P2名前:</label>
          <input type="text" id="p2Name" value="Player2" style="flex:1;">
        </div>
      </div>
    </div>

    <div class="card">
      <h2>3. ゲームモード選択</h2>
      <div class="radio-group">
        <label class="radio-label">
          <input type="radio" name="gameMode" value="SHOTS10" checked onchange="updateModeDescription()">
          モード1: 10発勝負 (5発交代)
        </label>
        <label class="radio-label">
          <input type="radio" name="gameMode" value="COUNTUP" onchange="updateModeDescription()">
          モード2: カウントアップ500
        </label>
        <label class="radio-label">
          <input type="radio" name="gameMode" value="VS10" onchange="updateModeDescription()">
          モード3: 10ラウンド勝負 (得点制)
        </label>
      </div>
      <div id="modeDescription" class="desc-box"></div>
    </div>

    <div class="card">
      <h2>4. 中央 (BULL) の点数設定</h2>
      <div style="display: flex; align-items: center; gap: 10px;">
        <input type="number" id="bullScoreInput" value="50" min="0" max="500" style="width:80px;"> 点
      </div>
    </div>

    <div class="card">
      <button class="btn" style="background-color: #34c759;" onclick="startWithCountdown(true)">ゲームスタート！</button>
    </div>
  </div>


  <!-- ---------------- 2. ゲームプレイ画面 ---------------- -->
  <div id="gameScreen">
    <div class="game-status-bar">
      <span id="displayModeTitle">10発勝負</span> | <span id="displayRoundInfo">残り 5/5球</span>
    </div>

    <!-- スコア表示パネル -->
    <div class="score-board">
      <div id="p1Card" class="player-card active">
        <div class="p-name" id="displayP1Name">Player1</div>
        <div class="p-score" id="displayP1Score">0</div>
        <div class="p-sub" id="displayP1Sub">累計スコア</div>
      </div>
      <div id="p2Card" class="player-card">
        <div class="p-name" id="displayP2Name">Player2</div>
        <div class="p-score" id="displayP2Score">0</div>
        <div class="p-sub" id="displayP2Sub">累計スコア</div>
      </div>
    </div>

    <!-- 最新の命中ポップアップ -->
    <div id="hitPop" class="hit-pop" style="display:none;">
      🎯 命中！ +50点
    </div>

    <!-- 🔄 交代待機スタートボタンエリア -->
    <div id="turnStartBox" class="change-turn-box" style="display:none;">
      <p style="margin: 0 0 8px 0; font-weight: bold; font-size: 1.1rem;" id="nextPlayerAlert">次は Player2 のターンです</p>
      <button class="btn btn-warning" onclick="startNextTurnCountdown()">▶️ 準備完了！スタート</button>
    </div>

    <!-- 📊 スコア履歴 -->
    <div class="card" style="margin-top: 12px;">
      <h2 style="margin-bottom: 8px;">📊 投球ログ</h2>
      <ul id="historyList" class="history-list">
        <li class="history-item" style="color: #888;">投球データ待機中...</li>
      </ul>
    </div>

    <!-- 操作ボタンエリア -->
    <div class="action-buttons">
      <!-- 手動交代ボタン -->
      <button id="manualTurnBtn" class="btn btn-warning" onclick="forceChangeTurn()">🔄 手動で交代する</button>
      <!-- 設定画面へ戻るボタン -->
      <button class="btn btn-secondary" onclick="exitGame()">設定画面へ戻る</button>
    </div>
  </div>


  <script>
    const SERVICE_UUID        = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    let bluetoothDevice;
    let characteristic;
    let audioCtx = null;

    let gameState = {
      p1Name: "Player1",
      p2Name: "Player2",
      p1Score: 0,
      p2Score: 0,
      p1Wins: 0,
      p2Wins: 0,
      currentTurn: 1, // 1: P1, 2: P2
      shotsLeft: 5,
      mode: "SHOTS10"
    };

    const modeDescriptions = {
      "SHOTS10": "<b>【10発勝負】</b><br>各自5発（全10発）の合計スコアを競います。<br>5発で自動交代します。",
      "COUNTUP": "<b>【カウントアップ 500】</b><br>500点に到達するまでの投球数を競います。<br>5発ごとに交代します。",
      "VS10": "<b>【10ラウンド対戦】</b><br>1ラウンドにつき「P1が5発」「P2が5発」投げ、得点が高い方に1勝が入ります。"
    };

    const modeNames = {
      "SHOTS10": "10発勝負",
      "COUNTUP": "カウントアップ 500",
      "VS10": "10ラウンド対戦"
    };

    window.onload = function() {
      updateModeDescription();
    };

    function playRealBuzzer(duration, isLong = false) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const now = audioCtx.currentTime;
        const freqs = isLong ? [120, 243, 365, 487] : [150, 305, 460];
        
        freqs.forEach((freq) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          osc.type = (freq % 2 === 0) ? 'square' : 'sawtooth';
          osc.frequency.setValueAtTime(freq, now);
          osc.frequency.setValueAtTime(freq + (Math.random() * 10 - 5), now + 0.05);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          gain.gain.setValueAtTime(0.4, now);
          gain.gain.setValueAtTime(0.4, now + duration - 0.03);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

          osc.start(now);
          osc.stop(now + duration);
        });
      } catch (e) {
        console.log("Audio Error: " + e);
      }
    }

    function updateModeDescription() {
      const selectedMode = document.querySelector('input[name="gameMode"]:checked').value;
      document.getElementById("modeDescription").innerHTML = modeDescriptions[selectedMode];
    }

    async function connectBLE() {
      try {
        bluetoothDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'DartsTarget_ESP32' }],
          optionalServices: [SERVICE_UUID]
        });
        const server = await bluetoothDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

        await characteristic.startNotifications();
        characteristic.addEventListener('characteristicvaluechanged', handleNotify);

        document.getElementById("status").innerText = "接続完了！";
        document.getElementById("status").style.color = "green";
      } catch (error) {
        alert("接続エラー: " + error);
      }
    }

    // ⏱️ カウントダウン実行処理
    function startWithCountdown(isInitialStart = false, callback = null) {
      if (isInitialStart && !characteristic) {
        alert("先にBluetooth接続を行ってください。");
        return;
      }

      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      audioCtx.resume();

      const overlay = document.getElementById("countdownOverlay");
      const countNum = document.getElementById("countNum");
      const title = document.getElementById("countPlayerTitle");

      const nextPlayerName = (gameState.currentTurn === 1) ? gameState.p1Name : gameState.p2Name;
      title.innerText = isInitialStart ? `🎯 ${gameState.p1Name} のターン` : `🔄 交代: ${nextPlayerName} のターン`;

      overlay.style.display = "flex";

      let count = 3;
      countNum.innerText = count;
      playRealBuzzer(0.2, false);

      const timer = setInterval(() => {
        count--;
        if (count > 0) {
          countNum.innerText = count;
          playRealBuzzer(0.2, false);
        } else if (count === 0) {
          countNum.innerText = "START!";
          playRealBuzzer(0.9, true);
        } else {
          clearInterval(timer);
          overlay.style.display = "none";
          
          if (isInitialStart) {
            document.getElementById("setupScreen").style.display = "none";
            document.getElementById("gameScreen").style.display = "block";
            applyAndStart();
          } else if (callback) {
            callback();
          }
        }
      }, 1000);
    }

    async function applyAndStart() {
      gameState.p1Name = document.getElementById("p1Name").value.trim() || "Player1";
      gameState.p2Name = document.getElementById("p2Name").value.trim() || "Player2";
      gameState.mode = document.querySelector('input[name="gameMode"]:checked').value;
      const bullPoints = document.getElementById("bullScoreInput").value;

      gameState.p1Score = 0;
      gameState.p2Score = 0;
      gameState.p1Wins = 0;
      gameState.p2Wins = 0;
      gameState.currentTurn = 1;
      gameState.shotsLeft = 5;

      document.getElementById("turnStartBox").style.display = "none";
      document.getElementById("manualTurnBtn").style.display = "block";
      updateUIBoard();
      clearHistory();

      const encoder = new TextEncoder();
      try {
        await characteristic.writeValue(encoder.encode("SET_MODE:" + gameState.mode));
        await characteristic.writeValue(encoder.encode("SET_BULL:" + bullPoints));
        await characteristic.writeValue(encoder.encode("SHOT_START"));
        addHistoryItem(`ゲーム開始 [${modeNames[gameState.mode]}]`, "round-end");
      } catch (err) {
        alert("送信エラー: " + err);
      }
    }

    function updateUIBoard() {
      document.getElementById("displayModeTitle").innerText = modeNames[gameState.mode];
      document.getElementById("displayP1Name").innerText = gameState.p1Name;
      document.getElementById("displayP2Name").innerText = gameState.p2Name;

      if (gameState.mode === "VS10") {
        document.getElementById("displayP1Score").innerText = gameState.p1Wins + "勝";
        document.getElementById("displayP2Score").innerText = gameState.p2Wins + "勝";
        document.getElementById("displayP1Sub").innerText = `(現ラウンド:${gameState.p1Score}点)`;
        document.getElementById("displayP2Sub").innerText = `(現ラウンド:${gameState.p2Score}点)`;
      } else {
        document.getElementById("displayP1Score").innerText = gameState.p1Score;
        document.getElementById("displayP2Score").innerText = gameState.p2Score;
        document.getElementById("displayP1Sub").innerText = "累計スコア";
        document.getElementById("displayP2Sub").innerText = "累計スコア";
      }

      document.getElementById("displayRoundInfo").innerText = `残り ${gameState.shotsLeft}/5球`;

      if (gameState.currentTurn === 1) {
        document.getElementById("p1Card").classList.add("active");
        document.getElementById("p2Card").classList.remove("active");
      } else {
        document.getElementById("p2Card").classList.add("active");
        document.getElementById("p1Card").classList.remove("active");
      }
    }

    function showHitPop(text) {
      const pop = document.getElementById("hitPop");
      pop.innerText = text;
      pop.style.display = "block";
      setTimeout(() => { pop.style.display = "none"; }, 1500);
    }

    // 📡 ESP32からの通知受信用ロジック
    function handleNotify(event) {
      const value = new TextDecoder().decode(event.target.value).trim();
      console.log("ESP32受信:", value);

      if (value.startsWith("GAME_OVER") || value.startsWith("VS_GAME_OVER")) {
        playRealBuzzer(0.8, true);
        
        let winnerName = "引き分け";
        if (gameState.p1Score > gameState.p2Score) winnerName = gameState.p1Name;
        else if (gameState.p2Score > gameState.p1Score) winnerName = gameState.p2Name;

        showHitPop(`🎉 勝者: ${winnerName}!`);
        addHistoryItem(`🎉 ゲームセット！ 勝者: <b>${winnerName}</b>`, "game-end");
        document.getElementById("turnStartBox").style.display = "none";
        document.getElementById("manualTurnBtn").style.display = "none";
        return;
      }

      // 5発終了時（自動交代待機）
      if (value === "ROUND_CLEAR") {
        prepareForNextTurn(false);
        return;
      }

      if (value.startsWith("VS_ROUND_RESULT")) {
        playRealBuzzer(0.4, true);
        if (value.includes("WIN:P1")) gameState.p1Wins++;
        else if (value.includes("WIN:P2")) gameState.p2Wins++;
        updateUIBoard();
        return;
      }

      if (value.startsWith("HIT:")) {
        playRealBuzzer(0.12, false);

        const firstPart = value.split("|")[0];
        const hitPoints = parseInt(firstPart.replace("HIT:", ""), 10) || 0;

        const activePlayerName = (gameState.currentTurn === 1) ? gameState.p1Name : gameState.p2Name;

        if (gameState.currentTurn === 1) {
          gameState.p1Score += hitPoints;
        } else {
          gameState.p2Score += hitPoints;
        }

        gameState.shotsLeft--;

        showHitPop(`🎯 ${activePlayerName}: +${hitPoints}点!`);
        addHistoryItem(`🎯 <b>${activePlayerName}</b>: +${hitPoints}点`, "normal");

        updateUIBoard();
      }
    }

    // 🔄 交代前の準備（自動・手動共通）
    function prepareForNextTurn(isManual = false) {
      playRealBuzzer(0.4, true);

      // ターンを切り替え
      if (gameState.currentTurn === 1) {
        gameState.currentTurn = 2;
      } else {
        gameState.currentTurn = 1;
      }
      gameState.shotsLeft = 5;

      const nextPlayerName = (gameState.currentTurn === 1) ? gameState.p1Name : gameState.p2Name;
      
      document.getElementById("nextPlayerAlert").innerText = `次は ${nextPlayerName} のターンです`;
      document.getElementById("turnStartBox").style.display = "block";
      document.getElementById("manualTurnBtn").style.display = "none"; // 待機中は手動ボタンを隠す

      const logText = isManual ? `🔄 [手動交代] <b>${nextPlayerName}</b> の準備待ち` : `⏸️ 5発達成！ <b>${nextPlayerName}</b> の準備待ち`;
      addHistoryItem(logText, "round-end");
    }

    // 🔘 手動交代ボタンが押された時
    function forceChangeTurn() {
      if (confirm("現在のターンを終了して交代しますか？")) {
        prepareForNextTurn(true);
      }
    }

    // ▶️ ボタンが押されたらカウントダウンを開始
    function startNextTurnCountdown() {
      document.getElementById("turnStartBox").style.display = "none";
      document.getElementById("manualTurnBtn").style.display = "block";

      const nextPlayerName = (gameState.currentTurn === 1) ? gameState.p1Name : gameState.p2Name;

      startWithCountdown(false, async () => {
        updateUIBoard();
        addHistoryItem(`▶️ ターン開始: <b>${nextPlayerName}</b>`, "round-end");

        // カウントダウン完了後、ESP32へセンサー再開通知
        if (characteristic) {
          const encoder = new TextEncoder();
          try {
            await characteristic.writeValue(encoder.encode("NEXT_ROUND"));
          } catch (e) {
            console.error("NEXT_ROUND送信失敗:", e);
          }
        }
      });
    }

    function addHistoryItem(text, type = "normal", badgeText = "") {
      const list = document.getElementById("historyList");
      if (list.children.length === 1 && list.children[0].style.color !== "") list.innerHTML = "";
      const li = document.createElement("li");
      li.className = "history-item " + type;
      let content = `<span>${text}</span>`;
      if (badgeText) content += `<span class="badge">${badgeText}</span>`;
      li.innerHTML = content;
      list.insertBefore(li, list.firstChild);
    }

    function clearHistory() {
      document.getElementById("historyList").innerHTML = '<li class="history-item" style="color: #888;">投球データ待機中...</li>';
    }

    function exitGame() {
      document.getElementById("gameScreen").style.display = "none";
      document.getElementById("setupScreen").style.display = "block";
    }
  </script>
</body>
</html>
