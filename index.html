<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ダーツターゲットコントローラー</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 15px;
      background-color: #f4f4f9;
      color: #333;
    }
    .card {
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 15px;
    }
    h2 { margin-top: 0; color: #1a73e8; font-size: 1.2rem; }
    .btn {
      background-color: #007aff;
      color: white;
      border: none;
      padding: 10px 16px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }
    .btn:active { background-color: #0056b3; }
    .radio-group { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
    .radio-label { display: flex; align-items: center; font-size: 15px; cursor: pointer; }
    .radio-label input { margin-right: 8px; transform: scale(1.2); }
    .desc-box {
      background-color: #eef3fc;
      border-left: 4px solid #007aff;
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.5;
      border-radius: 4px;
      margin-top: 10px;
    }
    input[type="number"] {
      font-size: 16px;
      padding: 6px;
      width: 80px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    #log {
      font-family: monospace;
      font-size: 12px;
      background: #222;
      color: #0f0;
      padding: 10px;
      border-radius: 8px;
      height: 120px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <h1>🎯 ダーツボード操作</h1>

  <!-- 1. 接続管理 -->
  <div class="card">
    <h2>1. ESP32接続</h2>
    <button class="btn" onclick="connectBLE()">Bluetooth 接続開始</button>
    <p id="status" style="margin-top:8px; font-weight:bold; color:red;">未接続</p>
  </div>

  <!-- 2. ゲームモード選択（説明付き） -->
  <div class="card">
    <h2>2. ゲームモード選択</h2>
    <div class="radio-group">
      <label class="radio-label">
        <input type="radio" name="gameMode" value="SHOTS10" checked onchange="updateModeDescription()">
        モード1: 10発勝負 (5発交代)
      </label>
      <label class="radio-label">
        <input type="radio" name="gameMode" value="COUNTUP" onchange="updateModeDescription()">
        モード2: カウントアップ500
      </label>
      <label class="radio-label">
        <input type="radio" name="gameMode" value="VS10" onchange="updateModeDescription()">
        モード3: 10ラウンド勝負 (得点制)
      </label>
    </div>

    <!-- モードの説明テキスト表示エリア -->
    <div id="modeDescription" class="desc-box">
      <!-- JavaScriptで動的に更新されます -->
    </div>
  </div>

  <!-- 3. 中央（BULL）の点数設定 -->
  <div class="card">
    <h2>3. 中央 (BULL) の点数設定</h2>
    <div style="display: flex; align-items: center; gap: 10px;">
      <input type="number" id="bullScoreInput" value="50" min="0" max="500"> 点
    </div>
  </div>

  <!-- 設定送信 ＆ スタート -->
  <div class="card">
    <button class="btn" style="background-color: #34c759;" onclick="applyAndStart()">設定を反映してスタート！</button>
  </div>

  <!-- 4. 受信ログ -->
  <div class="card">
    <h2>受信ログ</h2>
    <div id="log"></div>
  </div>

  <script>
    const SERVICE_UUID        = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    let bluetoothDevice;
    let characteristic;

    // 各モードの説明文定義
    const modeDescriptions = {
      "SHOTS10": "<b>【10発勝負】</b><br>全10発を投げて合計スコアを競います。<br>5発投げた時点で1度交代挟み（ラウンドクリア）、合計10発でゲーム終了となります。",
      "COUNTUP": "<b>【カウントアップ 500】</b><br>合計スコアが500点に到達するまでの投球数を競うモードです。<br>5発ごとに交代し、誰かが500点を超えた時点でゲーム終了です。",
      "VS10": "<b>【10ラウンド対戦】</b><br>1ラウンドにつき「プレイヤー1が5発」「プレイヤー2が5発」交互に投げます。<br>各ラウンドで合計点が高い方に<b>1得点</b>が入り、全10ラウンド終了時に獲得得点（勝ち星）が多い方が勝利となります。"
    };

    // 初期化時に説明文を表示
    window.onload = function() {
      updateModeDescription();
    };

    // ラジオボタン選択時に説明文を切り替える関数
    function updateModeDescription() {
      const selectedMode = document.querySelector('input[name="gameMode"]:checked').value;
      document.getElementById("modeDescription").innerHTML = modeDescriptions[selectedMode];
    }

    // ログ表示補助
    function log(msg) {
      const logDiv = document.getElementById("log");
      logDiv.innerHTML += msg + "<br>";
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    // Bluetooth接続
    async function connectBLE() {
      try {
        log("デバイス検索中...");
        bluetoothDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'DartsTarget_ESP32' }],
          optionalServices: [SERVICE_UUID]
        });

        const server = await bluetoothDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

        await characteristic.startNotifications();
        characteristic.addEventListener('characteristicvaluechanged', handleNotify);

        document.getElementById("status").innerText = "接続完了！";
        document.getElementById("status").style.color = "green";
        log("接続成功！");
      } catch (error) {
        log("接続エラー: " + error);
      }
    }

    // 設定送信とゲーム開始
    async function applyAndStart() {
      if (!characteristic) {
        alert("先にBluetooth接続を行ってください。");
        return;
      }

      const mode = document.querySelector('input[name="gameMode"]:checked').value;
      const bullPoints = document.getElementById("bullScoreInput").value;
      const encoder = new TextEncoder();

      try {
        // モード設定を送信
        await characteristic.writeValue(encoder.encode("SET_MODE:" + mode));
        // 中央点数設定を送信
        await characteristic.writeValue(encoder.encode("SET_BULL:" + bullPoints));
        // ゲーム開始・判定開始コマンド送信
        await characteristic.writeValue(encoder.encode("SHOT_START"));

        log(`設定完了: [${mode}] 中央:${bullPoints}点 でスタート`);
        alert("設定を送信し、ゲームを開始しました！");
      } catch (err) {
        log("送信エラー: " + err);
      }
    }

    // ESP32からのデータ受信ハンドラ
    function handleNotify(event) {
      const value = new TextDecoder().decode(event.target.value);
      log("受信: " + value);

      if (value === "ROUND_CLEAR") {
        alert("5発投げ終えました！プレイヤーを交代して「スタート」を押してください。");
      }
      else if (value.startsWith("VS_ROUND_RESULT:")) {
        alert("【ラウンド結果】\n" + value.replace(/\|/g, "\n"));
      }
      else if (value.startsWith("VS_GAME_OVER:")) {
        alert("【全ラウンド終了！】\n" + value);
      }
      else if (value === "GAME_OVER") {
        alert("ゲームクリア / GAME OVER！");
      }
    }
  </script>
</body>
</html>
