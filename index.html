<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ダーツターゲットコントローラー</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 12px;
      background-color: #f0f2f5;
      color: #333;
      margin: 0;
    }
    .card {
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 12px;
    }
    h2 { margin-top: 0; color: #1a73e8; font-size: 1.1rem; }
    .btn {
      background-color: #007aff;
      color: white;
      border: none;
      padding: 14px 16px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      margin-top: 5px;
    }
    .btn:active { background-color: #0056b3; }
    .btn-secondary { background-color: #8e8e93; }
    .btn-warning { background-color: #ff9500; }
    .radio-group { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
    .radio-label { display: flex; align-items: center; font-size: 15px; cursor: pointer; }
    .radio-label input { margin-right: 8px; transform: scale(1.2); }
    .desc-box {
      background-color: #eef3fc;
      border-left: 4px solid #007aff;
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.5;
      border-radius: 4px;
      margin-top: 10px;
    }
    input[type="text"], input[type="number"], select {
      font-size: 16px;
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    .player-inputs { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .player-row { display: flex; align-items: center; gap: 10px; }

    /* ⏱️ 全画面カウントダウン */
    #countdownOverlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.95);
      color: #ff3b30;
      font-size: 80px;
      font-weight: 900;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 9999;
      letter-spacing: 2px;
      text-align: center;
    }
    #countPlayerTitle {
      font-size: 28px;
      color: #34c759;
      margin-bottom: 20px;
    }

    /* 🎯 プレイ画面 */
    #gameScreen {
      display: none;
    }
    .score-board {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .player-card {
      background: #f8f9fa;
      border: 3px solid #ddd;
      border-radius: 12px;
      padding: 10px 6px;
      text-align: center;
      transition: all 0.3s ease;
    }
    .player-card.active {
      border-color: #007aff;
      background: #eef6ff;
      box-shadow: 0 0 12px rgba(0, 122, 255, 0.4);
      transform: scale(1.02);
    }
    .p-name { font-size: 1rem; font-weight: bold; color: #333; margin-bottom: 4px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
    .p-score { font-size: 1.8rem; font-weight: bold; color: #1a73e8; margin: 4px 0; }
    .p-sub { font-size: 0.75rem; color: #666; }

    .game-status-bar {
      background: #333;
      color: white;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
      margin-bottom: 10px;
    }

    /* 💥 命中ポップアップ */
    .hit-pop {
      background: #ffcc00;
      color: #000;
      font-size: 1.4rem;
      font-weight: bold;
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      margin: 10px 0;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* 🔄 交代待機カード */
    .change-turn-box {
      background: #fff3cd;
      border: 2px solid #ffeba2;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      margin: 10px 0;
    }

    /* 📊 履歴 */
    .history-list {
      list-style: none; padding: 0; margin: 0;
      max-height: 180px; overflow-y: auto;
      border: 1px solid #ddd; border-radius: 8px; background: #fafafa;
    }
    .history-item {
      padding: 8px 12px; border-bottom: 1px solid #eee; font-size: 13px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .history-item.round-end { background-color: #e3f2fd; font-weight: bold; color: #0d47a1; }
    .history-item.game-end { background-color: #e8f5e9; font-weight: bold; color: #1b5e20; }
    .badge { background: #007aff; color: white; padding: 2px 8px; border-radius: 12px; font-size: 11px; }

    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div id="countdownOverlay">
    <div id="countPlayerTitle">Next Player</div>
    <div id="countNum">3</div>
  </div>

  <div id="setupScreen">
    <h1>🎯 ダーツボード設定</h1>

    <div class="card">
      <h2>1. ESP32接続</h2>
      <button class="btn" onclick="connectBLE()">Bluetooth 接続開始</button>
      <p id="status" style="margin-top:8px; font-weight:bold; color:red;">未接続</p>
    </div>

    <div class="card">
      <h2>2. プレイヤー登録</h2>
      <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
        <label style="font-weight:bold;">人数選択:</label>
        <select id="playerCountSelect" onchange="renderPlayerInputs()">
          <option value="1">1人</option>
          <option value="2" selected>2人</option>
          <option value="3">3人</option>
          <option value="4">4人</option>
          <option value="5">5人</option>
        </select>
      </div>
      <div class="player-inputs" id="playerInputsContainer">
      </div>
    </div>

    <div class="card">
      <h2>3. ゲームモード選択</h2>
      <div class="radio-group">
        <label class="radio-label">
          <input type="radio" name="gameMode" value="SHOTS10" checked onchange="updateModeDescription()">
          モード1: 10発勝負 (5発交代)
        </label>
        <label class="radio-label">
          <input type="radio" name="gameMode" value="COUNTUP" onchange="updateModeDescription()">
          モード2: カウントアップ500 (先攻/後攻平等ルール)
        </label>
        <label class="radio-label">
          <input type="radio" name="gameMode" value="VS10" onchange="updateModeDescription()">
          モード3: 10ラウンド勝負 (得点制)
        </label>
      </div>
      <div id="modeDescription" class="desc-box"></div>
    </div>

    <div class="card">
      <h2>4. 中央 (BULL) の点数設定</h2>
      <div style="display: flex; align-items: center; gap: 10px;">
        <input type="number" id="bullScoreInput" value="50" min="0" max="500" style="width:80px;"> 点
      </div>
    </div>

    <div class="card">
      <button class="btn" style="background-color: #34c759;" onclick="startWithCountdown(true)">ゲームスタート！</button>
    </div>
  </div>


  <div id="gameScreen">
    <div class="game-status-bar">
      <span id="displayModeTitle">10発勝負</span> | <span id="displayRoundInfo">第 1 ラウンド (残り 5/5球)</span>
    </div>

    <div class="score-board" id="scoreBoardContainer">
    </div>

    <div id="hitPop" class="hit-pop" style="display:none;">
      🎯 命中！ +50点
    </div>

    <div id="turnStartBox" class="change-turn-box" style="display:none;">
      <p style="margin: 0 0 8px 0; font-weight: bold; font-size: 1.1rem;" id="nextPlayerAlert">次は Player2 のターンです</p>
      <button class="btn btn-warning" onclick="startNextTurnCountdown()">▶️ 準備完了！スタート</button>
    </div>

    <div class="card" style="margin-top: 12px;">
      <h2 style="margin-bottom: 8px;">📊 投球ログ</h2>
      <ul id="historyList" class="history-list">
        <li class="history-item" style="color: #888;">投球データ待機中...</li>
      </ul>
    </div>

    <div class="action-buttons">
      <button id="manualTurnBtn" class="btn btn-warning" onclick="forceChangeTurn()">🔄 手動で交代する</button>
      <button class="btn btn-secondary" onclick="exitGame()">設定画面へ戻る</button>
    </div>
  </div>


  <script>
    const SERVICE_UUID        = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    let bluetoothDevice;
    let characteristic;
    let audioCtx = null;

    let gameState = {
      players: [],
      currentTurnIdx: 0,
      currentRound: 1,
      shotsLeft: 5,
      mode: "SHOTS10",
      isGameOver: false
    };

    const modeDescriptions = {
      "SHOTS10": "<b>【10発勝負】</b><br>各自5発（全10発）の合計スコアを競います。<br>5発で自動交代します。",
      "COUNTUP": "<b>【カウントアップ 500】</b><br>500点到達を目指します。全員が同じ回数（各5発/ラウンド）投げるまで判定を待つ公平なルールです。",
      "VS10": "<b>【10ラウンド対戦】</b><br>1ラウンドにつき全員が5発ずつ投げ、得点が高い方に1勝が入ります。"
    };

    const modeNames = {
      "SHOTS10": "10発勝負",
      "COUNTUP": "カウントアップ 500",
      "VS10": "10ラウンド対戦"
    };

    window.onload = function() {
      renderPlayerInputs();
      updateModeDescription();
    };

    function renderPlayerInputs() {
      const count = parseInt(document.getElementById("playerCountSelect").value, 10);
      const container = document.getElementById("playerInputsContainer");
      container.innerHTML = "";

      for (let i = 1; i <= count; i++) {
        const row = document.createElement("div");
        row.className = "player-row";
        row.innerHTML = `
          <label style="width: 80px; font-weight:bold;">P${i}名前:</label>
          <input type="text" id="p${i}Name" value="Player${i}" style="flex:1;">
        `;
        container.appendChild(row);
      }
    }

    function playRealBuzzer(duration, isLong = false) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const now = audioCtx.currentTime;
        const freqs = isLong ? [120, 243, 365, 487] : [150, 305, 460];
        
        freqs.forEach((freq) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          osc.type = (freq % 2 === 0) ? 'square' : 'sawtooth';
          osc.frequency.setValueAtTime(freq, now);
          osc.frequency.setValueAtTime(freq + (Math.random() * 10 - 5), now + 0.05);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          gain.gain.setValueAtTime(0.4, now);
          gain.gain.setValueAtTime(0.4, now + duration - 0.03);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

          osc.start(now);
          osc.stop(now + duration);
        });
      } catch (e) {
        console.log("Audio Error: " + e);
      }
    }

    function updateModeDescription() {
      const selectedMode = document.querySelector('input[name="gameMode"]:checked').value;
      document.getElementById("modeDescription").innerHTML = modeDescriptions[selectedMode];
    }

    async function connectBLE() {
      try {
        bluetoothDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'DartsTarget_ESP32' }],
          optionalServices: [SERVICE_UUID]
        });
        const server = await bluetoothDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

        await characteristic.startNotifications();
        characteristic.addEventListener('characteristicvaluechanged', handleNotify);

        document.getElementById("status").innerText = "接続完了！";
        document.getElementById("status").style.color = "green";
      } catch (error) {
        alert("接続エラー: " + error);
      }
    }

    function startWithCountdown(isInitialStart = false, callback = null) {
      if (isInitialStart && !characteristic) {
        alert("先にBluetooth接続を行ってください。");
        return;
      }

      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      audioCtx.resume();

      const overlay = document.getElementById("countdownOverlay");
      const countNum = document.getElementById("countNum");
      const title = document.getElementById("countPlayerTitle");

      let nextPlayerName = "Player1";
      if (isInitialStart) {
        const p1Val = document.getElementById("p1Name") ? document.getElementById("p1Name").value.trim() : "Player1";
        nextPlayerName = p1Val || "Player1";
      } else {
        nextPlayerName = gameState.players[gameState.currentTurnIdx].name;
      }

      title.innerText = isInitialStart ? `🎯 ${nextPlayerName} のターン` : `🔄 交代: ${nextPlayerName} のターン`;
      overlay.style.display = "flex";

      let count = 3;
      countNum.innerText = count;
      playRealBuzzer(0.2, false);

      const timer = setInterval(() => {
        count--;
        if (count > 0) {
          countNum.innerText = count;
          playRealBuzzer(0.2, false);
        } else if (count === 0) {
          countNum.innerText = "START!";
          playRealBuzzer(0.9, true);
        } else {
          clearInterval(timer);
          overlay.style.display = "none";
          
          if (isInitialStart) {
            document.getElementById("setupScreen").style.display = "none";
            document.getElementById("gameScreen").style.display = "block";
            applyAndStart();
          } else if (callback) {
            callback();
          }
        }
      }, 1000);
    }

    async function applyAndStart() {
      const count = parseInt(document.getElementById("playerCountSelect").value, 10);
      gameState.players = [];

      for (let i = 1; i <= count; i++) {
        const inputElem = document.getElementById(`p${i}Name`);
        const nameVal = inputElem ? inputElem.value.trim() : `Player${i}`;
        gameState.players.push({
          name: nameVal || `Player${i}`,
          score: 0,
          wins: 0
        });
      }

      gameState.mode = document.querySelector('input[name="gameMode"]:checked').value;
      const bullPoints = document.getElementById("bullScoreInput").value;

      gameState.currentTurnIdx = 0;
      gameState.currentRound = 1;
      gameState.shotsLeft = 5;
      gameState.isGameOver = false;

      document.getElementById("turnStartBox").style.display = "none";
      document.getElementById("manualTurnBtn").style.display = "block";
      
      initUIBoard();
      updateUIBoard();
      clearHistory();

      const encoder = new TextEncoder();
      try {
        await characteristic.writeValue(encoder.encode("SET_MODE:" + gameState.mode));
        await characteristic.writeValue(encoder.encode("SET_BULL:" + bullPoints));
        await characteristic.writeValue(encoder.encode("SHOT_START"));
        addHistoryItem(`ゲーム開始 [${modeNames[gameState.mode]}] - 参加人数: ${count}人`, "round-end");
      } catch (err) {
        alert("送信エラー: " + err);
      }
    }

    function initUIBoard() {
      const container = document.getElementById("scoreBoardContainer");
      container.innerHTML = "";

      gameState.players.forEach((p, idx) => {
        const card = document.createElement("div");
        card.id = `pCard_${idx}`;
        card.className = `player-card ${idx === 0 ? 'active' : ''}`;
        card.innerHTML = `
          <div class="p-name" id="pName_${idx}">${p.name}</div>
          <div class="p-score" id="pScore_${idx}">0</div>
          <div class="p-sub" id="pSub_${idx}">累計スコア</div>
        `;
        container.appendChild(card);
      });
    }

    function updateUI
