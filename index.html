<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ダーツターゲットコントローラー</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 12px;
      background-color: #f0f2f5;
      color: #333;
      margin: 0;
    }
    .card {
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 12px;
    }
    h2 { margin-top: 0; color: #1a73e8; font-size: 1.1rem; }
    .btn {
      background-color: #007aff;
      color: white;
      border: none;
      padding: 14px 16px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      margin-top: 5px;
    }
    .btn:active { background-color: #0056b3; }
    .btn-secondary { background-color: #8e8e93; }
    .btn-warning { background-color: #ff9500; }
    .radio-group { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
    .radio-label { display: flex; align-items: center; font-size: 15px; cursor: pointer; }
    .radio-label input { margin-right: 8px; transform: scale(1.2); }
    .desc-box {
      background-color: #eef3fc;
      border-left: 4px solid #007aff;
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.5;
      border-radius: 4px;
      margin-top: 10px;
    }
    input[type="text"], input[type="number"], select {
      font-size: 16px;
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    .player-inputs { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .player-row { display: flex; align-items: center; gap: 10px; }

    /* ⏱️ 全画面カウントダウン */
    #countdownOverlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.95);
      color: #ff3b30;
      font-size: 80px;
      font-weight: 900;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 9999;
      letter-spacing: 2px;
      text-align: center;
    }
    #countPlayerTitle {
      font-size: 28px;
      color: #34c759;
      margin-bottom: 20px;
    }

    /* 🎯 プレイ画面 */
    #gameScreen { display: none; }
    .score-board {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .player-card {
      background: #f8f9fa;
      border: 3px solid #ddd;
      border-radius: 12px;
      padding: 10px 6px;
      text-align: center;
      transition: all 0.3s ease;
    }
    .player-card.active {
      border-color: #007aff;
      background: #eef6ff;
      box-shadow: 0 0 12px rgba(0, 122, 255, 0.4);
      transform: scale(1.02);
    }
    .p-name { font-size: 1rem; font-weight: bold; color: #333; margin-bottom: 4px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
    .p-score { font-size: 1.8rem; font-weight: bold; color: #1a73e8; margin: 4px 0; }
    .p-sub { font-size: 0.75rem; color: #666; }

    .game-status-bar {
      background: #333;
      color: white;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .hit-pop {
      background: #ffcc00;
      color: #000;
      font-size: 1.4rem;
      font-weight: bold;
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      margin: 10px 0;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .change-turn-box {
      background: #fff3cd;
      border: 2px solid #ffeba2;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      margin: 10px 0;
    }

    .history-list {
      list-style: none; padding: 0; margin: 0;
      max-height: 180px; overflow-y: auto;
      border: 1px solid #ddd; border-radius: 8px; background: #fafafa;
    }
    .history-item {
      padding: 8px 12px; border-bottom: 1px solid #eee; font-size: 13px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .history-item.round-end { background-color: #e3f2fd; font-weight: bold; color: #0d47a1; }
    .history-item.game-end { background-color: #e8f5e9; font-weight: bold; color: #1b5e20; }
    .badge { background: #007aff; color: white; padding: 2px 8px; border-radius: 12px; font-size: 11px; }

    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div id="countdownOverlay">
    <div id="countPlayerTitle">Next Player</div>
    <div id="countNum">3</div>
  </div>

  <div id="setupScreen">
    <h1>🎯 ダーツボード設定</h1>

    <div class="card">
      <h2>1. ESP32接続</h2>
      <button class="btn" onclick="connectBLE()">Bluetooth 接続開始</button>
      <p id="status" style="margin-top:8px; font-weight:bold; color:red;">未接続</p>
    </div>

    <div class="card">
      <h2>2. プレイヤー登録</h2>
      <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
        <label style="font-weight:bold;">人数選択:</label>
        <select id="playerCountSelect" onchange="renderPlayerInputs()">
          <option value="1">1人</option>
          <option value="2" selected>2人</option>
          <option value="3">3人</option>
          <option value="4">4人</option>
          <option value="5">5人</option>
        </select>
      </div>
      <div class="player-inputs" id="playerInputsContainer"></div>
    </div>

    <div class="card">
      <h2>3. ゲームモード選択</h2>
      <div class="radio-group">
        <label class="radio-label">
          <input type="radio" name="gameMode" value="SHOTS10" checked onchange="updateModeDescription()">
          モード1: 10発勝負 (各自5発/全10発)
        </label>
        <label class="radio-label">
          <input type="radio" name="gameMode" value="COUNTUP" onchange="updateModeDescription()">
          モード2: カウントアップ500 (先攻/後攻平等ルール)
        </label>
      </div>
      <div id="modeDescription" class="desc-box"></div>
    </div>

    <div class="card">
      <h2>4. 中央 (BULL) の点数設定</h2>
      <div style="display: flex; align-items: center; gap: 10px;">
        <input type="number" id="bullScoreInput" value="50" min="0" max="500" style="width:80px;"> 点
      </div>
    </div>

    <div class="card">
      <button class="btn" style="background-color: #34c759;" onclick="startWithCountdown(true)">ゲームスタート！</button>
    </div>
  </div>

  <div id="gameScreen">
    <div class="game-status-bar">
      <span id="displayModeTitle">カウントアップ</span> | <span id="displayRoundInfo">第 1 ラウンド (残り 5/5球)</span>
    </div>

    <div class="score-board" id="scoreBoardContainer"></div>

    <div id="hitPop" class="hit-pop" style="display:none;">🎯 命中！ +50点</div>

    <div id="turnStartBox" class="change-turn-box" style="display:none;">
      <p style="margin: 0 0 8px 0; font-weight: bold; font-size: 1.1rem;" id="nextPlayerAlert">次は Player2 のターンです</p>
      <button class="btn btn-warning" onclick="startNextTurnCountdown()">▶️ 準備完了！スタート</button>
    </div>

    <div class="card" style="margin-top: 12px;">
      <h2 style="margin-bottom: 8px;">📊 投球ログ</h2>
      <ul id="historyList" class="history-list">
        <li class="history-item" style="color: #888;">投球データ待機中...</li>
      </ul>
    </div>

    <div class="action-buttons">
      <button id="manualTurnBtn" class="btn btn-warning" onclick="forceChangeTurn()">🔄 手動で交代する</button>
      <button class="btn btn-secondary" onclick="exitGame()">設定画面へ戻る</button>
    </div>
  </div>

  <script>
    const SERVICE_UUID        = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    let bluetoothDevice, characteristic;
    let audioCtx = null;

    let gameState = {
      players: [],
      currentTurnIdx: 0,
      currentRound: 1,
      shotsLeft: 5,
      mode: "SHOTS10",
      isGameOver: false,
      pTotalShots: [] // 各プレイヤーの累計投球数
    };

    const modeDescriptions = {
      "SHOTS10": "<b>【10発勝負】</b><br>各自5発（全10発）の合計スコアを競います。",
      "COUNTUP": "<b>【カウントアップ 500】</b><br>500点到達を目指します。全員が毎ラウンド5発ずつ投げ、ラウンド終了時に判定します。"
    };

    const modeNames = {
      "SHOTS10": "10発勝負",
      "COUNTUP": "カウントアップ 500"
    };

    window.onload = function() {
      renderPlayerInputs();
      updateModeDescription();
    };

    function renderPlayerInputs() {
      const count = parseInt(document.getElementById("playerCountSelect").value, 10);
      const container = document.getElementById("playerInputsContainer");
      container.innerHTML = "";
      for (let i = 1; i <= count; i++) {
        container.innerHTML += `
          <div class="player-row">
            <label style="width: 80px; font-weight:bold;">P${i}名前:</label>
            <input type="text" id="p${i}Name" value="Player${i}" style="flex:1;">
          </div>`;
      }
    }

    function playRealBuzzer(duration, isLong = false) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const freqs = isLong ? [120, 243, 365, 487] : [150, 305, 460];
        freqs.forEach((freq) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = (freq % 2 === 0) ? 'square' : 'sawtooth';
          osc.frequency.setValueAtTime(freq, now);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          gain.gain.setValueAtTime(0.4, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
          osc.start(now);
          osc.stop(now + duration);
        });
      } catch (e) {}
    }

    function updateModeDescription() {
      const selectedMode = document.querySelector('input[name="gameMode"]:checked').value;
      document.getElementById("modeDescription").innerHTML = modeDescriptions[selectedMode];
    }

    async function connectBLE() {
      try {
        bluetoothDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'DartsTarget_ESP32' }],
          optionalServices: [SERVICE_UUID]
        });
        const server = await bluetoothDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);
        await characteristic.startNotifications();
        characteristic.addEventListener('characteristicvaluechanged', handleNotify);
        document.getElementById("status").innerText = "接続完了！";
        document.getElementById("status").style.color = "green";
      } catch (error) {
        alert("接続エラー: " + error);
      }
    }

    function startWithCountdown(isInitialStart = false, callback = null) {
      if (isInitialStart && !characteristic) {
        alert("先にBluetooth接続を行ってください。");
        return;
      }
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      audioCtx.resume();

      const overlay = document.getElementById("countdownOverlay");
      const countNum = document.getElementById("countNum");
      const title = document.getElementById("countPlayerTitle");

      let nextPlayerName = isInitialStart ? 
        (document.getElementById("p1Name")?.value.trim() || "Player1") : 
        gameState.players[gameState.currentTurnIdx].name;

      title.innerText = isInitialStart ? `🎯 ${nextPlayerName} のターン` : `🔄 交代: ${nextPlayerName} のターン`;
      overlay.style.display = "flex";

      let count = 3;
      countNum.innerText = count;
      playRealBuzzer(0.2, false);

      const timer = setInterval(() => {
        count--;
        if (count > 0) {
          countNum.innerText = count;
          playRealBuzzer(0.2, false);
        } else if (count === 0) {
          countNum.innerText = "START!";
          playRealBuzzer(0.9, true);
        } else {
          clearInterval(timer);
          overlay.style.display = "none";
          if (isInitialStart) {
            document.getElementById("setupScreen").style.display = "none";
            document.getElementById("gameScreen").style.display = "block";
            applyAndStart();
          } else if (callback) {
            callback();
          }
        }
      }, 1000);
    }

    async function applyAndStart() {
      const count = parseInt(document.getElementById("playerCountSelect").value, 10);
      gameState.players = [];
      gameState.pTotalShots = [];

      for (let i = 1; i <= count; i++) {
        const nameVal = document.getElementById(`p${i}Name`)?.value.trim() || `Player${i}`;
        gameState.players.push({ name: nameVal, score: 0 });
        gameState.pTotalShots.push(0);
      }

      gameState.mode = document.querySelector('input[name="gameMode"]:checked').value;
      const bullPoints = document.getElementById("bullScoreInput").value;

      gameState.currentTurnIdx = 0;
      gameState.currentRound = 1;
      gameState.shotsLeft = 5;
      gameState.isGameOver = false;

      document.getElementById("turnStartBox").style.display = "none";
      document.getElementById("manualTurnBtn").style.display = "block";

      initUIBoard();
      updateUIBoard();
      clearHistory();

      const encoder = new TextEncoder();
      try {
        await characteristic.writeValue(encoder.encode("SET_MODE:" + gameState.mode));
        await characteristic.writeValue(encoder.encode("SET_BULL:" + bullPoints));
        await characteristic.writeValue(encoder.encode("SHOT_START"));
        addHistoryItem(`ゲーム開始 [${modeNames[gameState.mode]}] - 人数: ${count}人`, "round-end");
      } catch (err) {}
    }

    function initUIBoard() {
      const container = document.getElementById("scoreBoardContainer");
      container.innerHTML = "";
      gameState.players.forEach((p, idx) => {
        container.innerHTML += `
          <div id="pCard_${idx}" class="player-card ${idx === 0 ? 'active' : ''}">
            <div class="p-name">${p.name}</div>
            <div class="p-score" id="pScore_${idx}">0</div>
            <div class="p-sub">累計スコア</div>
          </div>`;
      });
    }

    function updateUIBoard() {
      document.getElementById("displayModeTitle").innerText = modeNames[gameState.mode];
      document.getElementById("displayRoundInfo").innerText = `第 ${gameState.currentRound} R (残り ${gameState.shotsLeft}/5球)`;

      gameState.players.forEach((p, idx) => {
        const card = document.getElementById(`pCard_${idx}`);
        const scoreElem = document.getElementById(`pScore_${idx}`);
        if (card) {
          if (idx === gameState.currentTurnIdx) card.classList.add("active");
          else card.classList.remove("active");
        }
        if (scoreElem) scoreElem.innerText = p.score;
      });
    }

    function showHitPop(text) {
      const pop = document.getElementById("hitPop");
      pop.innerText = text;
      pop.style.display = "block";
      setTimeout(() => { pop.style.display = "none"; }, 1500);
    }

    function handleNotify(event) {
      if (gameState.isGameOver) return;
      const value = new TextDecoder().decode(event.target.value).trim();

      // マイコンからのGAME_OVERは全モードで完全に無視する（Webで判定するため）
      if (value.startsWith("GAME_OVER")) return;

      if (value === "ROUND_CLEAR") {
        prepareForNextTurn(false);
        return;
      }

      if (value.startsWith("HIT:")) {
        const hitPoints = parseInt(value.replace("HIT:", ""), 10) || 0;
        const activePlayer = gameState.players[gameState.currentTurnIdx];
        
        activePlayer.score += hitPoints;
        gameState.pTotalShots[gameState.currentTurnIdx]++;
        gameState.shotsLeft--;

        showHitPop(`🎯 ${activePlayer.name}: +${hitPoints}点!`);
        addHistoryItem(`🎯 <b>${activePlayer.name}</b>: +${hitPoints}点`, "normal");

        updateUIBoard();

        // 10発勝負（モード1）で各自が計10発投げきった場合の自動終了判定
        if (gameState.mode === "SHOTS10" && gameState.pTotalShots[gameState.currentTurnIdx] >= 10) {
          if (gameState.shotsLeft <= 0) {
            prepareForNextTurn(false);
          }
        }
      }
    }

    function prepareForNextTurn(isManual = false) {
      const nextIdx = (gameState.currentTurnIdx + 1) % gameState.players.length;

      // ラウンド完了（全員が投球完了したタイミング）
      if (nextIdx === 0) {
        // モード1（10発勝負）の終了判定：全員が10発（2ラウンド）投げ終えたか
        if (gameState.mode === "SHOTS10" && gameState.pTotalShots.every(s => s >= 10)) {
          triggerGameOver();
          return;
        }

        // モード2（カウントアップ）の終了判定：500点以上のプレイヤーがいるか
        if (gameState.mode === "COUNTUP") {
          const winners = gameState.players.filter(p => p.score >= 500);
          if (winners.length > 0) {
            triggerGameOver();
            return;
          }
        }

        gameState.currentRound++;
      }

      gameState.currentTurnIdx = nextIdx;
      gameState.shotsLeft = 5;

      const nextPlayerName = gameState.players[gameState.currentTurnIdx].name;
      document.getElementById("nextPlayerAlert").innerText = `次は ${nextPlayerName} のターンです`;
      document.getElementById("turnStartBox").style.display = "block";
      document.getElementById("manualTurnBtn").style.display = "none";

      const logText = isManual ? `🔄 [手動交代] <b>${nextPlayerName}</b> の準備待ち` : `⏸️ 5発達成！ <b>${nextPlayerName}</b> の準備待ち`;
      addHistoryItem(logText, "round-end");
    }

    function triggerGameOver() {
      gameState.isGameOver = true;
      playRealBuzzer(0.8, true);

      let maxScore = -1;
      let winners = [];

      gameState.players.forEach(p => {
        if (p.score > maxScore) {
          maxScore = p.score;
          winners = [p.name];
        } else if (p.score === maxScore) {
          winners.push(p.name);
        }
      });

      const winnerText = winners.length === 1 ? winners[0] : `引き分け (${winners.join(", ")})`;
      showHitPop(`🎉 勝者: ${winnerText}!`);
      addHistoryItem(`🎉 ゲームセット！ 勝者: <b>${winnerText} (${maxScore}点)</b>`, "game-end");

      document.getElementById("turnStartBox").style.display = "none";
      document.getElementById("manualTurnBtn").style.display = "none";
    }

    function forceChangeTurn() {
      if (confirm("現在のターンを終了して次のプレイヤーへ交代しますか？")) {
        prepareForNextTurn(true);
      }
    }

    function startNextTurnCountdown() {
      document.getElementById("turnStartBox").style.display = "none";
      document.getElementById("manualTurnBtn").style.display = "block";

      const nextPlayerName = gameState.players[gameState.currentTurnIdx].name;
      startWithCountdown(false, async () => {
        updateUIBoard();
        addHistoryItem(`▶️ ターン開始: <b>${nextPlayerName}</b>`, "round-end");
        if (characteristic) {
          try {
            await characteristic.writeValue(new TextEncoder().encode("NEXT_ROUND"));
          } catch (e) {}
        }
      });
    }

    function addHistoryItem(text, type = "normal") {
      const list = document.getElementById("historyList");
      if (list.children.length === 1 && list.children[0].style.color !== "") list.innerHTML = "";
      const li = document.createElement("li");
      li.className = "history-item " + type;
      li.innerHTML = `<span>${text}</span>`;
      list.insertBefore(li, list.firstChild);
    }

    function clearHistory() {
      document.getElementById("historyList").innerHTML = '<li class="history-item" style="color: #888;">投球データ待機中...</li>';
    }

    function exitGame() {
      document.getElementById("gameScreen").style.display = "none";
      document.getElementById("setupScreen").style.display = "block";
    }
  </script>
</body>
</html>
