<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ダーツターゲットコントローラー</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 15px;
      background-color: #f4f4f9;
      color: #333;
    }
    .card {
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 15px;
    }
    h2 { margin-top: 0; color: #1a73e8; font-size: 1.2rem; }
    .btn {
      background-color: #007aff;
      color: white;
      border: none;
      padding: 14px 16px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }
    .btn:active { background-color: #0056b3; }
    .btn-secondary { background-color: #8e8e93; }
    .radio-group { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
    .radio-label { display: flex; align-items: center; font-size: 15px; cursor: pointer; }
    .radio-label input { margin-right: 8px; transform: scale(1.2); }
    .desc-box {
      background-color: #eef3fc;
      border-left: 4px solid #007aff;
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.5;
      border-radius: 4px;
      margin-top: 10px;
    }
    input[type="text"], input[type="number"] {
      font-size: 16px;
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    .player-inputs { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .player-row { display: flex; align-items: center; gap: 10px; }
    
    /* 🔊 iPhone全画面カウントダウン表示 */
    #countdownOverlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.9);
      color: white;
      font-size: 100px;
      font-weight: bold;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      flex-direction: column;
    }

    /* 📊 スコア履歴リスト */
    .history-list {
      list-style: none; padding: 0; margin: 0;
      max-height: 220px; overflow-y: auto;
      border: 1px solid #ddd; border-radius: 8px; background: #fafafa;
    }
    .history-item {
      padding: 10px 12px; border-bottom: 1px solid #eee; font-size: 14px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .history-item.round-end { background-color: #e3f2fd; font-weight: bold; color: #0d47a1; }
    .history-item.game-end { background-color: #e8f5e9; font-weight: bold; color: #1b5e20; }
    .badge { background: #007aff; color: white; padding: 2px 8px; border-radius: 12px; font-size: 12px; }
  </style>
</head>
<body>

  <!-- カウントダウン画面オーバレイ -->
  <div id="countdownOverlay">
    <div id="countNum">3</div>
  </div>

  <h1>🎯 ダーツボード操作</h1>

  <!-- 1. 接続管理 -->
  <div class="card">
    <h2>1. ESP32接続</h2>
    <button class="btn" onclick="connectBLE()">Bluetooth 接続開始</button>
    <p id="status" style="margin-top:8px; font-weight:bold; color:red;">未接続</p>
  </div>

  <!-- 2. プレイヤー登録 -->
  <div class="card">
    <h2>2. プレイヤー登録</h2>
    <div class="player-inputs">
      <div class="player-row">
        <label style="width: 80px; font-weight:bold;">P1名前:</label>
        <input type="text" id="p1Name" value="Player1" style="flex:1;">
      </div>
      <div class="player-row">
        <label style="width: 80px; font-weight:bold;">P2名前:</label>
        <input type="text" id="p2Name" value="Player2" style="flex:1;">
      </div>
    </div>
  </div>

  <!-- 3. ゲームモード選択 -->
  <div class="card">
    <h2>3. ゲームモード選択</h2>
    <div class="radio-group">
      <label class="radio-label">
        <input type="radio" name="gameMode" value="SHOTS10" checked onchange="updateModeDescription()">
        モード1: 10発勝負 (5発交代)
      </label>
      <label class="radio-label">
        <input type="radio" name="gameMode" value="COUNTUP" onchange="updateModeDescription()">
        モード2: カウントアップ500
      </label>
      <label class="radio-label">
        <input type="radio" name="gameMode" value="VS10" onchange="updateModeDescription()">
        モード3: 10ラウンド勝負 (得点制)
      </label>
    </div>
    <div id="modeDescription" class="desc-box"></div>
  </div>

  <!-- 4. 中央 (BULL) 点数設定 -->
  <div class="card">
    <h2>4. 中央 (BULL) の点数設定</h2>
    <div style="display: flex; align-items: center; gap: 10px;">
      <input type="number" id="bullScoreInput" value="50" min="0" max="500" style="width:80px;"> 点
    </div>
  </div>

  <!-- スタートボタン -->
  <div class="card">
    <button class="btn" style="background-color: #34c759;" onclick="startWithCountdown()">設定・名前を登録してスタート！</button>
  </div>

  <!-- 5. スコア履歴一覧 -->
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
      <h2 style="margin: 0;">📊 スコア履歴</h2>
      <button class="btn btn-secondary" style="width: auto; padding: 4px 10px; font-size: 12px; margin: 0;" onclick="clearHistory()">履歴をクリア</button>
    </div>
    <ul id="historyList" class="history-list">
      <li class="history-item" style="color: #888;">投球データがここに表示されます</li>
    </ul>
  </div>

  <script>
    const SERVICE_UUID        = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    let bluetoothDevice;
    let characteristic;
    let audioCtx = null;

    const modeDescriptions = {
      "SHOTS10": "<b>【10発勝負】</b><br>全10発の合計スコアを競います。<br>5発ごとにプレイヤーを交代します。",
      "COUNTUP": "<b>【カウントアップ 500】</b><br>500点に到達するまでの投球数を競います。<br>5発ごとにプレイヤーを交代します。",
      "VS10": "<b>【10ラウンド対戦】</b><br>1ラウンドにつき「P1が5発」「P2が5発」投げ、得点が高い方に1勝（1得点）が入ります。<br>10ラウンド後の勝利数で勝敗を決定します。"
    };

    window.onload = function() {
      updateModeDescription();
    };

    // 🔊 iPhoneスピーカーで電子音を発声させる関数
    function playSound(freq, duration, type = 'sine') {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start();
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        console.log("Audio Error: " + e);
      }
    }

    function updateModeDescription() {
      const selectedMode = document.querySelector('input[name="gameMode"]:checked').value;
      document.getElementById("modeDescription").innerHTML = modeDescriptions[selectedMode];
    }

    // ⏱️ iPhone画面でのカウントダウン＆サウンド再生
    function startWithCountdown() {
      if (!characteristic) {
        alert("先にBluetooth接続を行ってください。");
        return;
      }

      // iOSの音声制御をアンロック
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      audioCtx.resume();

      const overlay = document.getElementById("countdownOverlay");
      const countNum = document.getElementById("countNum");
      overlay.style.display = "flex";

      let count = 3;
      countNum.innerText = count;
      playSound(440, 0.2); // ピッ (3)

      const timer = setInterval(() => {
        count--;
        if (count > 0) {
          countNum.innerText = count;
          playSound(440, 0.2); // ピッ (2, 1)
        } else if (count === 0) {
          countNum.innerText = "START!";
          playSound(880, 0.5); // ピー！ (START)
        } else {
          clearInterval(timer);
          overlay.style.display = "none";
          applyAndStart(); // カウント完了でESP32へコマンド送信
        }
      }, 1000);
    }

    async function connectBLE() {
      try {
        bluetoothDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'DartsTarget_ESP32' }],
          optionalServices: [SERVICE_UUID]
        });

        const server = await bluetoothDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

        await characteristic.startNotifications();
        characteristic.addEventListener('characteristicvaluechanged', handleNotify);

        document.getElementById("status").innerText = "接続完了！";
        document.getElementById("status").style.color = "green";
        addHistoryItem("Bluetooth接続が完了しました");
      } catch (error) {
        alert("接続エラー: " + error);
      }
    }

    async function applyAndStart() {
      const mode = document.querySelector('input[name="gameMode"]:checked').value;
      const bullPoints = document.getElementById("bullScoreInput").value;
      const p1 = document.getElementById("p1Name").value || "Player1";
      const p2 = document.getElementById("p2Name").value || "Player2";

      const encoder = new TextEncoder();

      try {
        await characteristic.writeValue(encoder.encode("SET_P1:" + p1));
        await characteristic.writeValue(encoder.encode("SET_P2:" + p2));
        await characteristic.writeValue(encoder.encode("SET_MODE:" + mode));
        await characteristic.writeValue(encoder.encode("SET_BULL:" + bullPoints));
        await characteristic.writeValue(encoder.encode("SHOT_START"));

        clearHistory();
        addHistoryItem(`ゲーム開始 [${mode}] 中央:${bullPoints}点`, "round-end");
      } catch (err) {
        alert("送信エラー: " + err);
      }
    }

    function addHistoryItem(text, type = "normal", badgeText = "") {
      const list = document.getElementById("historyList");
      if (list.children.length === 1 && list.children[0].style.color !== "") {
        list.innerHTML = "";
      }
      const li = document.createElement("li");
      li.className = "history-item " + type;
      let content = `<span>${text}</span>`;
      if (badgeText) content += `<span class="badge">${badgeText}</span>`;
      li.innerHTML = content;
      list.insertBefore(li, list.firstChild);
    }

    function clearHistory() {
      document.getElementById("historyList").innerHTML = '<li class="history-item" style="color: #888;">投球データがここに表示されます</li>';
    }

    // ダーツ命中・交代・終了時の音再生処理
    function handleNotify(event) {
      const value = new TextDecoder().decode(event.target.value);

      if (value.startsWith("HIT:")) {
        playSound(600, 0.15); // ヒット音（ピッ）
        const parts = value.split("|");
        const player = parts[0].substring(4);
        const points = parts[1].substring(2);
        const total = parts[2].substring(6);
        addHistoryItem(`🎯 <b>${player}</b>: +${points}点`, "normal", `累計 ${total}点`);
      }
      else if (value.startsWith("ROUND_CLEAR:")) {
        playSound(523, 0.3); // 交代音（ポーン）
        const nextPlayer = value.split(":")[1];
        addHistoryItem(`🔄 5発交代 ➔ 次は <b>${nextPlayer}</b> のターン`, "round-end");
      }
      else if (value.startsWith("VS_ROUND_RESULT:")) {
        playSound(659, 0.3);
        const parts = value.split("|");
        const rNum = parts[0].substring(16);
        const winner = parts[3].substring(7);
        const score = parts[4].substring(6);
        addHistoryItem(`🏆 ${rNum} 勝利: <b>${winner}</b> (星: ${score})`, "round-end");
      }
      else if (value.startsWith("VS_GAME_OVER") || value.startsWith("GAME_OVER")) {
        // ファンファーレ音（ド・ミ・ソ・ド）
        setTimeout(() => playSound(523, 0.15), 0);
        setTimeout(() => playSound(659, 0.15), 150);
        setTimeout(() => playSound(784, 0.15), 300);
        setTimeout(() => playSound(1046, 0.4), 450);

        const parts = value.split("|");
        const winner = parts[1].substring(7);
        addHistoryItem(`🎉 ゲームセット！ 勝者: <b>${winner}</b>`, "game-end");
      }
    }
  </script>
</body>
</html>
