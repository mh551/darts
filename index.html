<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ダーツボード コントローラー</title>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #1a1a2e;
      color: #fff;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      color: #e94560;
      margin-bottom: 10px;
    }
    .status-panel {
      background-color: #16213e;
      padding: 15px 25px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .status-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: #ff4d4d;
    }
    .status-indicator.connected {
      background-color: #00ff88;
    }
    button {
      background-color: #0f3460;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover {
      background-color: #e94560;
    }
    .settings-panel {
      background-color: #16213e;
      padding: 20px;
      border-radius: 10px;
      width: 100%;
      max-width: 450px;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
      color: #a0a0a0;
    }
    select, input[type="text"] {
      width: 100%;
      padding: 8px;
      border-radius: 5px;
      border: 1px solid #0f3460;
      background-color: #1a1a2e;
      color: white;
      box-sizing: border-box;
    }
    .game-board {
      background-color: #16213e;
      padding: 20px;
      border-radius: 10px;
      width: 100%;
      max-width: 450px;
      text-align: center;
    }
    .score-display {
      font-size: 48px;
      font-weight: bold;
      color: #00ff88;
      margin: 10px 0;
    }
    .shots-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 15px 0;
    }
    .shot-box {
      width: 45px;
      height: 45px;
      line-height: 45px;
      background-color: #0f3460;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
    }
    .scoreboard {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    .scoreboard th, .scoreboard td {
      border: 1px solid #0f3460;
      padding: 8px;
      text-align: center;
    }
    .scoreboard th {
      background-color: #0f3460;
    }
    .active-player {
      background-color: rgba(233, 69, 96, 0.3);
    }
  </style>
</head>
<body>

  <h1>Darts Target Controller</h1>

  <div class="status-panel">
    <div id="statusIndicator" class="status-indicator"></div>
    <span id="statusText">未接続</span>
    <button id="connectBtn">ESP32に接続</button>
  </div>

  <div class="settings-panel">
    <div class="form-group">
      <label for="gameMode">ゲームモード</label>
      <select id="gameMode">
        <option value="SHOTS10">10発勝負 (2人プレイ)</option>
        <option value="COUNTUP">カウントアップ (8ラウンド)</option>
        <option value="VS10">10ラウンド対戦 (2人対戦)</option>
      </select>
    </div>
    <div class="form-group">
      <label for="bullScore">BULL点数</label>
      <select id="bullScore">
        <option value="50">50点 (FAT BULL)</option>
        <option value="25">25点 (SEPARATE BULL)</option>
      </select>
    </div>
    <div class="form-group">
      <label for="p1Name">プレイヤー 1 名前</label>
      <input type="text" id="p1Name" value="Player 1">
    </div>
    <div class="form-group" id="p2Group">
      <label for="p2Name">プレイヤー 2 名前</label>
      <input type="text" id="p2Name" value="Player 2">
    </div>
    <button id="startBtn" style="width: 100%; margin-top: 10px;">ゲームスタート</button>
  </div>

  <div class="game-board">
    <h2 id="turnInfo">ゲームを開始してください</h2>
    <div id="totalScoreDisplay" class="score-display">0</div>

    <div class="shots-container">
      <div id="shot1" class="shot-box">-</div>
      <div id="shot2" class="shot-box">-</div>
      <div id="shot3" class="shot-box">-</div>
      <div id="shot4" class="shot-box">-</div>
      <div id="shot5" class="shot-box">-</div>
    </div>

    <table class="scoreboard" id="scoreTable">
      <thead>
        <tr>
          <th>プレイヤー</th>
          <th>合計スコア</th>
        </tr>
      </thead>
      <tbody>
        <tr id="rowP1">
          <td id="nameDisplayP1">Player 1</td>
          <td id="scoreDisplayP1">0</td>
        </tr>
        <tr id="rowP2">
          <td id="nameDisplayP2">Player 2</td>
          <td id="scoreDisplayP2">0</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    let bleDevice;
    let bleCharacteristic;

    let gameState = {
      mode: "SHOTS10",
      bull: 50,
      currentPlayer: 1,
      currentRound: 1,
      shotsInTurn: 0,
      scores: { p1: 0, p2: 0 },
      turnScores: []
    };

    const connectBtn = document.getElementById('connectBtn');
    const startBtn = document.getElementById('startBtn');
    const statusIndicator = document.getElementById('statusIndicator');
    const statusText = document.getElementById('statusText');

    connectBtn.addEventListener('click', async () => {
      try {
        statusText.innerText = "接続中...";
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'DartsTarget_ESP32' }],
          optionalServices: [SERVICE_UUID]
        });

        const server = await bleDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        bleCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

        await bleCharacteristic.startNotifications();
        bleCharacteristic.addEventListener('characteristicvaluechanged', handleData);

        statusIndicator.classList.add('connected');
        statusText.innerText = "接続完了";
        connectBtn.style.display = "none";
      } catch (error) {
        console.error(error);
        statusText.innerText = "接続失敗";
      }
    });

    startBtn.addEventListener('click', async () => {
      if (!bleCharacteristic) {
        alert("ESP32に接続してください");
        return;
      }

      gameState.mode = document.getElementById('gameMode').value;
      gameState.bull = parseInt(document.getElementById('bullScore').value);
      gameState.currentPlayer = 1;
      gameState.currentRound = 1;
      gameState.shotsInTurn = 0;
      gameState.scores.p1 = 0;
      gameState.scores.p2 = 0;
      gameState.turnScores = [];

      document.getElementById('nameDisplayP1').innerText = document.getElementById('p1Name').value;
      document.getElementById('nameDisplayP2').innerText = document.getElementById('p2Name').value;
      document.getElementById('scoreDisplayP1').innerText = "0";
      document.getElementById('scoreDisplayP2').innerText = "0";

      await sendCommand(`SET_MODE:${gameState.mode}`);
      await sendCommand(`SET_BULL:${gameState.bull}`);
      await sendCommand("SHOT_START");

      resetShotsUI();
      updateTurnUI();
    });

    async function sendCommand(cmd) {
      if (bleCharacteristic) {
        const encoder = new TextEncoder();
        await bleCharacteristic.writeValue(encoder.encode(cmd));
      }
    }

    function handleData(event) {
      const value = new TextDecoder().decode(event.target.value);
      console.log("Received:", value);

      if (value.startsWith("HIT:")) {
        const points = parseInt(value.split(":")[1]);
        recordHit(points);
      } else if (value === "ROUND_CLEAR") {
        setTimeout(handleRoundClear, 500);
      } else if (value === "GAME_OVER") {
        setTimeout(handleGameOver, 500);
      }
    }

    function recordHit(points) {
      if (gameState.shotsInTurn < 5) {
        gameState.shotsInTurn++;
        gameState.turnScores.push(points);

        document.getElementById(`shot${gameState.shotsInTurn}`).innerText = points;

        if (gameState.currentPlayer === 1) {
          gameState.scores.p1 += points;
          document.getElementById('scoreDisplayP1').innerText = gameState.scores.p1;
          document.getElementById('totalScoreDisplay').innerText = gameState.scores.p1;
        } else {
          gameState.scores.p2 += points;
          document.getElementById('scoreDisplayP2').innerText = gameState.scores.p2;
          document.getElementById('totalScoreDisplay').innerText = gameState.scores.p2;
        }
      }
    }

    function handleRoundClear() {
      if (gameState.mode === "SHOTS10") {
        gameState.currentPlayer = 2;
        alert(`${document.getElementById('p2Name').value} の順番です！`);
      } else if (gameState.mode === "VS10") {
        if (gameState.currentPlayer === 1) {
          gameState.currentPlayer = 2;
          alert(`ラウンド ${gameState.currentRound} : ${document.getElementById('p2Name').value} の順番です！`);
        } else {
          gameState.currentPlayer = 1;
          gameState.currentRound++;
          if (gameState.currentRound > 10) {
            handleGameOver();
            return;
          }
          alert(`ラウンド ${gameState.currentRound} : ${document.getElementById('p1Name').value} の順番です！`);
        }
      } else if (gameState.mode === "COUNTUP") {
        gameState.currentRound++;
        if (gameState.currentRound > 8) {
          handleGameOver();
          return;
        }
        alert(`ラウンド ${gameState.currentRound} 開始！`);
      }

      resetShotsUI();
      updateTurnUI();
      sendCommand("NEXT_ROUND");
    }

    function handleGameOver() {
      let msg = "ゲーム終了！\n";
      const p1 = document.getElementById('p1Name').value;
      const p2 = document.getElementById('p2Name').value;

      if (gameState.mode === "COUNTUP") {
        msg += `最終スコア: ${gameState.scores.p1} 点`;
      } else {
        msg += `${p1}: ${gameState.scores.p1} 点\n${p2}: ${gameState.scores.p2} 点\n\n`;
        if (gameState.scores.p1 > gameState.scores.p2) {
          msg += `勝者: ${p1}！`;
        } else if (gameState.scores.p2 > gameState.scores.p1) {
          msg += `勝者: ${p2}！`;
        } else {
          msg += "引き分け！";
        }
      }

      alert(msg);
      document.getElementById('turnInfo').innerText = "ゲーム終了";
    }

    function resetShotsUI() {
      gameState.shotsInTurn = 0;
      gameState.turnScores = [];
      for (let i = 1; i <= 5; i++) {
        document.getElementById(`shot${i}`).innerText = "-";
      }
    }

    function updateTurnUI() {
      const p1 = document.getElementById('p1Name').value;
      const p2 = document.getElementById('p2Name').value;

      if (gameState.currentPlayer === 1) {
        document.getElementById('turnInfo').innerText = `${p1} のターン (Round ${gameState.currentRound})`;
        document.getElementById('rowP1').classList.add('active-player');
        document.getElementById('rowP2').classList.remove('active-player');
        document.getElementById('totalScoreDisplay').innerText = gameState.scores.p1;
      } else {
        document.getElementById('turnInfo').innerText = `${p2} のターン (Round ${gameState.currentRound})`;
        document.getElementById('rowP2').classList.add('active-player');
        document.getElementById('rowP1').classList.remove('active-player');
        document.getElementById('totalScoreDisplay').innerText = gameState.scores.p2;
      }
    }
  </script>
</body>
</html>
